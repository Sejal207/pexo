version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: peoplepay360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-peoplepay360}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: peoplepay360-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: peoplepay360-azurite
    restart: unless-stopped
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

  hr-service:
    build:
      context: ../services/hr-service
      dockerfile: Dockerfile
    container_name: peoplepay360-hr-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/peoplepay360
      - DB_SCHEMA=hr
      - SECRET_KEY=${SECRET_KEY:-supersecretjwtkey_change_in_production_peoplepay360}
    depends_on:
      postgres:
        condition: service_healthy

  attendance-timeoff-service:
    build:
      context: ../services/attendance-timeoff-service
      dockerfile: Dockerfile
    container_name: peoplepay360-attendance-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/peoplepay360
      - DB_SCHEMA=attendance_timeoff
      - SECRET_KEY=${SECRET_KEY:-supersecretjwtkey_change_in_production_peoplepay360}
    depends_on:
      postgres:
        condition: service_healthy

  payroll-service:
    build:
      context: ../services/payroll-service
      dockerfile: Dockerfile
    container_name: peoplepay360-payroll-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/peoplepay360
      - DB_SCHEMA=payroll
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-supersecretjwtkey_change_in_production_peoplepay360}
      - HR_SERVICE_URL=http://hr-service:8001
      - ATTENDANCE_SERVICE_URL=http://attendance-timeoff-service:8002
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payroll-worker:
    build:
      context: ../services/payroll-service
      dockerfile: Dockerfile.worker
    container_name: peoplepay360-payroll-worker
    restart: unless-stopped
    command: celery -A celery_worker worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/peoplepay360
      - DB_SCHEMA=payroll
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-supersecretjwtkey_change_in_production_peoplepay360}
      - HR_SERVICE_URL=http://hr-service:8001
      - ATTENDANCE_SERVICE_URL=http://attendance-timeoff-service:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payroll-beat:
    build:
      context: ../services/payroll-service
      dockerfile: Dockerfile.worker
    container_name: peoplepay360-payroll-beat
    restart: unless-stopped
    command: celery -A celery_worker beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/peoplepay360
      - DB_SCHEMA=payroll
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: peoplepay360-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/peoplepay360
      - DB_SCHEMA=gateway
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-supersecretjwtkey_change_in_production_peoplepay360}
      - HR_SERVICE_URL=http://hr-service:8001
      - ATTENDANCE_SERVICE_URL=http://attendance-timeoff-service:8002
      - PAYROLL_SERVICE_URL=http://payroll-service:8003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: peoplepay360-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - api-gateway

  nginx:
    image: nginx:alpine
    container_name: peoplepay360-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - frontend

volumes:
  postgres_data:
  redis_data:
  azurite_data:
