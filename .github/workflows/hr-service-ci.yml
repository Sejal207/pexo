name: Hr Service CI

on:
  push:
    paths:
      - 'services/hr-service/**'
      - 'shared/python-libs/**'
      - '.github/workflows/hr-service-ci.yml'
  pull_request:
    paths:
      - 'services/hr-service/**'
      - 'shared/python-libs/**'
      - '.github/workflows/hr-service-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          if [ -f services/hr-service/requirements.txt ]; then pip install -r services/hr-service/requirements.txt; fi

      - name: Lint with Ruff
        run: |
          ruff check services/hr-service

      - name: Run Tests
        run: |
          PYTHONPATH=services/hr-service pytest services/hr-service/tests
