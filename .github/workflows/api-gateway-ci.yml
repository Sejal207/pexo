name: Api Gateway CI

on:
  push:
    paths:
      - 'services/api-gateway/**'
      - 'shared/python-libs/**'
      - '.github/workflows/api-gateway-ci.yml'
  pull_request:
    paths:
      - 'services/api-gateway/**'
      - 'shared/python-libs/**'
      - '.github/workflows/api-gateway-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          if [ -f services/api-gateway/requirements.txt ]; then pip install -r services/api-gateway/requirements.txt; fi

      - name: Lint with Ruff
        run: |
          ruff check services/api-gateway

      - name: Run Tests
        run: |
          pytest services/api-gateway/tests
