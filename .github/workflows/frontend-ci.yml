name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - 'shared/ts-types/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'shared/ts-types/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check & Lint
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
